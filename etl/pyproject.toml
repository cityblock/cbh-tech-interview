[project]
name = "etl"
version = "0.1.0"
description = "Availability ETL: ingest partner feeds into the interview app's SQLite users table"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
etl = "etl.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]
