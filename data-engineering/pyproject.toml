[project]
name = "cbh-tech-interview"
version = "0.0.0"
description = "Cityblock tech interview scaffold — after-hours support / user availability"
requires-python = ">=3.12,<3.13"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "strawberry-graphql[fastapi]>=0.325.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dev = "server.index:dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/server", "packages/web"]

[tool.pytest.ini_options]
testpaths = ["packages/server/test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
# The data model, GraphQL surface and form fields mirror the
# software-engineering track name for name, so they are camelCase by necessity.
ignore = ["N803", "N815"]

[tool.ruff.lint.isort]
known-first-party = ["server", "web"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
